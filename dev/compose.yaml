# The shared development setup of GMshield: the data services and every application whose sibling
# clone has a Dockerfile. Start and stop it with ./start and ./stop (see README.md in this folder).
#
# - Nothing here starts by itself: no container has a restart policy.
# - Every port is bound to 127.0.0.1 only.
# - Every credential below is a throwaway for development on this machine. Never reuse one.
# - Images are pinned by version and digest: the newest release at least two weeks old on 2026-11-12.
name: gmshield-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: "no"
    environment:
      POSTGRES_DB: gmshield
      POSTGRES_USER: gmshield
      POSTGRES_PASSWORD: gmshield-dev
    ports: ["127.0.0.1:${GMSHIELD_DEV_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmshield -d gmshield"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: "no"
    command: ["redis-server", "--requirepass", "gmshield-dev", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: gmshield-dev   # for the health check and for `docker compose exec redis redis-cli`
    ports: ["127.0.0.1:${GMSHIELD_DEV_REDIS_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 40

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: "no"
    environment:
      QDRANT__SERVICE__API_KEY: gmshield-dev
    ports: ["127.0.0.1:${GMSHIELD_DEV_QDRANT_PORT:-6333}:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  backend:
    build:
      context: ..
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      GMSHIELD_DB_URL: jdbc:postgresql://postgres:5432/gmshield
      GMSHIELD_DB_USER: gmshield
      GMSHIELD_DB_PASSWORD: gmshield-dev
      GMSHIELD_REDIS_HOST: redis
      GMSHIELD_REDIS_USERNAME: default
      GMSHIELD_REDIS_PASSWORD: gmshield-dev
      GMSHIELD_REDIS_TLS: "false"   # the development Redis has no TLS; production always verifies it
      # Throwaway vault keys (32 bytes of 3 and of 4): data stored in development is not protected.
      GMSHIELD_VAULT_MASTER_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      GMSHIELD_VAULT_INDEX_KEY: BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=
      # Sign-in with Google: your own OAuth client from the shell that runs ./start, or placeholders with
      # which the backend starts but Google refuses the sign-in. Never write a real one into this file.
      GMSHIELD_GOOGLE_CLIENT_ID: ${GMSHIELD_GOOGLE_CLIENT_ID:-not-a-real-client-id}
      GMSHIELD_GOOGLE_CLIENT_SECRET: ${GMSHIELD_GOOGLE_CLIENT_SECRET:-not-a-real-client-secret}
      GMSHIELD_PUBLIC_URL: http://localhost:${GMSHIELD_DEV_FRONTEND_PORT:-3000}
      # The frontend's service credential (Story 1.10): the same throwaway value is given to the frontend below.
      GMSHIELD_FRONTEND_CREDENTIAL: gmshield-dev-frontend-credential-throwaway
      # Session timings (optional; defaults 15m, 60s, 24h, 7d), for example to watch a rotation:
      # GMSHIELD_SESSION_RENEW_AFTER=20s GMSHIELD_SESSION_OVERLAP=5s GMSHIELD_SESSION_IDLE_TIMEOUT=2m ./start
      GMSHIELD_SESSION_RENEW_AFTER: ${GMSHIELD_SESSION_RENEW_AFTER:-15m}
      GMSHIELD_SESSION_OVERLAP: ${GMSHIELD_SESSION_OVERLAP:-60s}
      GMSHIELD_SESSION_IDLE_TIMEOUT: ${GMSHIELD_SESSION_IDLE_TIMEOUT:-24h}
      GMSHIELD_SESSION_ABSOLUTE_TIMEOUT: ${GMSHIELD_SESSION_ABSOLUTE_TIMEOUT:-7d}
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["backend_files:/var/lib/gmshield/files"]   # the encrypted file store
    ports: ["127.0.0.1:${GMSHIELD_DEV_BACKEND_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 60

  # The two applications below start only when their sibling clone has a Dockerfile: ./start
  # turns on the matching profile.
  frontend:
    profiles: ["frontend"]
    build:
      context: ../../GMshield-frontend
    restart: "no"
    depends_on:
      backend: {condition: service_healthy}
    environment:
      GMSHIELD_BACKEND_URL: http://backend:8080
      GMSHIELD_FRONTEND_CREDENTIAL: gmshield-dev-frontend-credential-throwaway   # the backend's, above
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:${GMSHIELD_DEV_FRONTEND_PORT:-3000}:3000"]
    healthcheck:
      # 200 only when the backend answers with a contract version the frontend accepts.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    profiles: ["worker"]
    build:
      context: ../../GMshield-worker
    restart: "no"
    depends_on:
      backend: {condition: service_healthy}
    environment:
      GMSHIELD_BACKEND_URL: http://backend:8080
      # Taken from your shell when set; otherwise a placeholder that cannot call the model.
      # Nothing calls the model yet, but the worker refuses to start without a key.
      GMSHIELD_ANTHROPIC_API_KEY: ${GMSHIELD_ANTHROPIC_API_KEY:-not-a-real-key}
    read_only: true
    tmpfs: ["/tmp"]
    # No port: the worker opens none. Healthy only when the backend answers with a contract
    # version the worker accepts (python -m gmshield_worker.health reads the worker's health file).
    healthcheck:
      test: ["CMD", "python", "-m", "gmshield_worker.health"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  postgres_data: {}
  redis_data: {}
  qdrant_data: {}
  backend_files: {}
