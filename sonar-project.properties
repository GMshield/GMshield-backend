# Read by the pipeline's SonarQube stage. The project key and name come from the pipeline.
# .gmshield-reports/ is the Dockerfile's test-reports stage, copied in by the pipeline;
# it also passes sonar.java.binaries=.gmshield-reports/classes.
sonar.sources=src/main
sonar.tests=src/test,src/boundaryFixtures
sonar.sourceEncoding=UTF-8
sonar.java.source=27
sonar.coverage.jacoco.xmlReportPaths=.gmshield-reports/jacoco.xml
sonar.junit.reportPaths=.gmshield-reports/junit
