# GMshield pipeline contract (see GMshield-pipeline/templates/pipeline.toml for every option).
# Active: the Dockerfile has the stages `test`, `test-reports` and `production`.

[service]
name = "backend"
port = 8080                    # HTTP port inside the container (0 = no HTTP, no DAST)
health_path = "/actuator/health"

[build]
test_target = "test"         # Dockerfile stage that runs the unit tests

[dast]
path = "/"
openapi = "/v3/api-docs/public"   # ZAP API scan of the public contract (committed as openapi/public.json)

[deploy]
host_port = 0                  # no host port: the frontend and the worker reach it on gmshield-app and gmshield-work
# Story 1.6 (AD-14): created on the first network (the health probe joins it), then connected to the rest.
# Postgres is on gmshield-data, Redis on gmshield-work; gmshield-outbound alone reaches the internet.
networks = ["gmshield-app", "gmshield-data", "gmshield-work", "gmshield-outbound"]
certs = true                   # ~/gmshield-ci/certs/backend/ca.crt at /run/gmshield/certs: TLS to Postgres and Redis
read_only = true
user = "10001:10001"
cap_drop = ["ALL"]
tmpfs = ["/tmp"]

[staging]
# The develop pipeline's throwaway copy (active DAST) runs with GMSHIELD_MODE=test, which reads the
# fixed connections in application-test-mode.yaml: a throwaway Postgres and Redis on the run's network.
services = ["postgres", "redis"]
