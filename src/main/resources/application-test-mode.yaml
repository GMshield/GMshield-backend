# GMSHIELD_MODE=test: throwaway dependencies that the pipeline starts beside the application.
# Every value is fixed here: test mode reads no GMSHIELD_* connection setting, so it cannot be
# pointed at a real host. Nothing here is a secret, and nothing reaches the internet.
spring:
  flyway:
    # The test-mode location adds vault_probe, the NFR-1 release gate's table; production never has it.
    locations: classpath:db/migration,classpath:db/test-mode-migration
  datasource:
    url: jdbc:postgresql://postgres:5432/gmshield
    username: gmshield
    password: gmshield-test-mode
  data:
    redis:
      host: redis
      port: 6379
      username: ""
      password: ""
      ssl:
        enabled: false   # plain connections to the throwaway services

# The vault's keys are random for each start and held in memory only (vault.service.VaultConfiguration).
# The file store is the run's throwaway volume, mounted by the pipeline at the production path.
gmshield:
  files:
    dir: /var/lib/gmshield/files
  # The fixed service credential of test mode, the same as the frontend's test mode (src/server/settings.ts).
  # Public on purpose: test mode refuses to start beside a real GMSHIELD_FRONTEND_CREDENTIAL. The session
  # timings still come from GMSHIELD_SESSION_* (application.yaml), so a run can shorten them.
  frontend-credential: gmshield-test-mode-frontend-credential-not-a-secret
  # The fixed worker credential of test mode (Story 1.12), the same as the worker's test mode (settings.py).
  # Public on purpose: test mode refuses to start beside a real GMSHIELD_WORKER_CREDENTIAL.
  worker-credential: gmshield-test-mode-worker-credential-not-a-secret
