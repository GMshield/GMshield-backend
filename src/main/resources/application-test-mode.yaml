# GMSHIELD_MODE=test: throwaway dependencies that the pipeline starts beside the application.
# Nothing here is a secret, and nothing reaches the internet.
spring:
  datasource:
    url: ${GMSHIELD_DB_URL:jdbc:postgresql://postgres:5432/gmshield}
    username: ${GMSHIELD_DB_USER:gmshield}
    password: gmshield-test-mode
  data:
    redis:
      host: ${GMSHIELD_REDIS_HOST:redis}
      port: ${GMSHIELD_REDIS_PORT:6379}
      password: ""
