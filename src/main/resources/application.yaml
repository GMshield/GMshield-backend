# Settings come from the environment (see README.md, "Settings"). GmshieldApplication checks
# them before Spring starts, so a placeholder below never fails with a Spring stack trace.
spring:
  application:
    name: gmshield-backend
  main:
    banner-mode: "off"
    log-startup-info: false   # it names the user and the path; GmshieldApplication logs application.started
  datasource:
    # Production: ...?sslmode=verify-full&sslrootcert=/run/gmshield/certs/ca.crt (TLS verified against
    # the private authority, host name included); written by GMshield-pipeline deploy/data-credentials.sh.
    url: ${GMSHIELD_DB_URL}
    username: ${GMSHIELD_DB_USER}
    password: ${GMSHIELD_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  # Library tables (Story 1.11) through JPA. The schema is Flyway's alone, and Hibernate never reads the
  # database's metadata at start: the dialect is given, so the application starts without the database.
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  data:
    redis:
      host: ${GMSHIELD_REDIS_HOST}
      port: ${GMSHIELD_REDIS_PORT:6379}
      username: ${GMSHIELD_REDIS_USERNAME}
      password: ${GMSHIELD_REDIS_PASSWORD}
      # TLS comes from application-redis-tls.yaml, added by GmshieldApplication outside test mode.
  web:
    resources:
      add-mappings: false   # an API only: an unknown path is a 404 problem detail, never a file lookup

# Encryption at rest (vault module, Story 1.7). Both keys are 32 random bytes in Base64, checked by
# StartupSettings before Spring starts; written once by GMshield-pipeline deploy/data-credentials.sh.
gmshield:
  vault:
    master-key: ${GMSHIELD_VAULT_MASTER_KEY}
    index-key: ${GMSHIELD_VAULT_INDEX_KEY}
  files:
    # The encrypted file store; the pipeline contract mounts the named volume gmshield-backend-files here.
    dir: ${GMSHIELD_FILES_DIR:/var/lib/gmshield/files}
  # Sign-in with Google (accounts module, Story 1.9). The client id and secret are entered by hand in the
  # server's backend.env; the public URL is the frontend's origin, set in .gmshield/pipeline.toml. Google
  # redirects to <public URL>/auth/google/callback. Test mode reads none of them: a stand-in replaces Google.
  google:
    client-id: ${GMSHIELD_GOOGLE_CLIENT_ID}
    client-secret: ${GMSHIELD_GOOGLE_CLIENT_SECRET}
  public-url: ${GMSHIELD_PUBLIC_URL}
  # The frontend's service credential (Story 1.10): every /api/v1 call carries Authorization: Bearer <it>
  # (shared.web.ServiceCredentialFilter). A secret, written by GMshield-pipeline deploy/data-credentials.sh into
  # backend.env and frontend.env. Test mode uses the fixed value in application-test-mode.yaml.
  frontend-credential: ${GMSHIELD_FRONTEND_CREDENTIAL}
  # The worker's credential (Story 1.12): every /internal/v1 call carries Authorization: Bearer <it>
  # (shared.web.WorkerCredentialFilter). A secret, written by GMshield-pipeline deploy/data-credentials.sh into
  # backend.env and worker.env. Test mode uses the fixed value in application-test-mode.yaml.
  worker-credential: ${GMSHIELD_WORKER_CREDENTIAL}
  # Sessions (accounts module, Story 1.10), Spring durations. StartupSettings refuses a start unless
  # overlap < renew-after < idle-timeout <= absolute-timeout; its defaults are the same as these.
  session:
    renew-after: ${GMSHIELD_SESSION_RENEW_AFTER:15m}
    overlap: ${GMSHIELD_SESSION_OVERLAP:60s}
    idle-timeout: ${GMSHIELD_SESSION_IDLE_TIMEOUT:24h}
    absolute-timeout: ${GMSHIELD_SESSION_ABSOLUTE_TIMEOUT:7d}
  # Jobs (jobs module, Story 1.12), Spring durations: a claim lapses 90 s after its last renewal, the worker renews
  # every 30 s, a job has 3 attempts, an offer nobody claimed is made again after 2 min, the sweep runs every 10 s.
  # JobSettings refuses a start unless renew-every < claim-lapse, reoffer-after < 1 h and 1 <= max-attempts <= 100.
  jobs:
    claim-lapse: ${GMSHIELD_JOB_CLAIM_LAPSE:90s}
    renew-every: ${GMSHIELD_JOB_RENEW_EVERY:30s}
    max-attempts: ${GMSHIELD_JOB_MAX_ATTEMPTS:3}
    reoffer-after: ${GMSHIELD_JOB_REOFFER_AFTER:2m}
    sweep-every: ${GMSHIELD_JOB_SWEEP_EVERY:10s}

server:
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

# Only /actuator/health answers, with the status and nothing else
# (shared.web.ActuatorScopeFilter refuses every other actuator path, whatever is set here).
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false

# One JSON object per line (shared.service.JsonLineLogFormatter).
logging:
  structured:
    format:
      console: io.github.gmshield.shared.service.JsonLineLogFormatter
  level:
    # Spring's "No mapping for GET <path>" warning would put a request path in the log;
    # request.completed already records the 404 with the route "unmatched".
    org.springframework.web.servlet.PageNotFound: "OFF"

# The two contract documents: /v3/api-docs/public and /v3/api-docs/internal
# (groups defined in shared.web.OpenApiConfiguration).
springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
